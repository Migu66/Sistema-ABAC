name: Main - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: apiABAC
  AZURE_WEBAPP_PACKAGE_PATH: ./publish

jobs:
  build-and-test:
    name: Build y Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore

    - name: Build
      id: build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      id: test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Rollback en caso de error
      if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Error detectado en producción. Iniciando rollback..."
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git revert HEAD --no-edit
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet publish src/API/Sistema.ABAC.API/Sistema.ABAC.API.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --nologo

    - name: Login en Azure (OIDC)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_31F1430FC51A4F6C8B6353D5764D7F22 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_583AC21267444020932CC15477684D7F }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_674CA3B58D0449F69BA9CF0702F198E8 }}

    - name: Deploy to Azure Web App
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
